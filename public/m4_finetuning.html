  <script>
    lucide.createIcons();

    // Mock Data Generation - 파인튜닝 대기열
    const models = [
      'SegFormer-B0-v.1.0', 'SegFormer-B0-v.1.1',
      'SegFormer-B2-v.1.0', 'SegFormer-B2-v.2.0',
      'SegFormer-B3-v.1.0'
    ];
    const fileTags = ['A01', 'A03', 'B01', 'B07', 'C04', 'C12', 'D02', 'E15', 'F08', 'G11'];
    const reasons = [
      { key: 'low_conf',  label: '신뢰도 저하',     cls: 'bg-yellow-900/20 text-yellow-400 border-yellow-900/40', icon: 'alert-triangle' },
      { key: 'user_flag', label: '사용자 플래그',   cls: 'bg-orange-900/20 text-orange-400 border-orange-900/40', icon: 'flag' },
      { key: 'missing',   label: '라벨 누락',       cls: 'bg-purple-900/20 text-purple-400 border-purple-900/40', icon: 'help-circle' }
    ];
    const labelStates = [
      { key: 'queued',      label: '대기',     cls: 'bg-gray-800 text-gray-400 border-gray-700' },
      { key: 'in_progress', label: '진행중',   cls: 'bg-blue-900/20 text-blue-400 border-blue-900/40' },
      { key: 'completed',   label: '완료',     cls: 'bg-emerald-900/20 text-emerald-400 border-emerald-900/40' },
      { key: 'used',        label: '사용됨',   cls: 'bg-gray-800 text-gray-500 border-gray-700' }
    ];

    function pickWeighted(items, weights) {
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < items.length; i++) {
        if ((r -= weights[i]) < 0) return items[i];
      }
      return items[items.length - 1];
    }

    function generateQueueData(count) {
      const data = [];
      const now = new Date();

      for (let i = 0; i < count; i++) {
        // 추론 결과가 큐에 적재된 시점: 평균 1시간 간격
        const time = new Date(now - i * 60 * 60 * 1000);
        const model = models[Math.floor(Math.random() * models.length)];
        const tag = fileTags[Math.floor(Math.random() * fileTags.length)];
        const dateStr = time.toISOString().slice(0, 10);
        const filename = `ortho_${dateStr}_${tag}.tif`;

        // 보정 사유 분포: 신뢰도 저하 60%, 사용자 플래그 25%, 라벨 누락 15%
        const reason = pickWeighted(reasons, [60, 25, 15]);

        // 추론 신뢰도: 사유에 따라 분포 다름
        let confidence;
        if (reason.key === 'low_conf') confidence = 0.55 + Math.random() * 0.20;       // 0.55 ~ 0.75
        else if (reason.key === 'user_flag') confidence = 0.78 + Math.random() * 0.15; // 0.78 ~ 0.93
        else confidence = 0.65 + Math.random() * 0.20;                                  // 0.65 ~ 0.85

        // 라벨링 상태 분포: 대기 50%, 진행중 15%, 완료 25%, 사용됨 10%
        const labelState = pickWeighted(labelStates, [50, 15, 25, 10]);

        data.push({
          id: i,
          time: time.toISOString().replace('T', ' ').slice(0, 19),
          model: model,
          filename: filename,
          reason: reason,
          confidence: confidence,
          labelState: labelState
        });
      }
      return data;
    }

    // Render Table
    const tableBody = document.getElementById('finetune-queue-body');
    const queueData = generateQueueData(50);

    document.getElementById('total-count').innerText = queueData.length.toLocaleString();
    document.getElementById('completed-count').innerText =
      queueData.filter(r => r.labelState.key === 'completed').length;

    queueData.forEach(row => {
      // 완료 상태만 체크박스 활성화 (파인튜닝 트리거 가능)
      const isSelectable = row.labelState.key === 'completed';
      const isUsed = row.labelState.key === 'used';

      const checkbox = isSelectable
        ? `<input type="checkbox" class="row-check w-4 h-4 accent-[#C5A059] bg-transparent border-gray-700 rounded cursor-pointer" data-id="${row.id}">`
        : `<input type="checkbox" disabled class="w-4 h-4 opacity-30 cursor-not-allowed">`;

      // 신뢰도 바
      const pct = (row.confidence * 100).toFixed(1);
      const pctInt = Math.round(row.confidence * 100);
      let barColor, label, labelCls;
      if (row.confidence >= 0.85) { barColor = 'bg-emerald-500'; label = 'High'; labelCls = 'text-emerald-500'; }
      else if (row.confidence >= 0.75) { barColor = 'bg-emerald-500'; label = 'Avg'; labelCls = 'text-gray-500'; }
      else { barColor = 'bg-yellow-500'; label = 'Low'; labelCls = 'text-yellow-500'; }

      // 조치 버튼: 상태에 따라 다름
      let actionBtn;
      if (row.labelState.key === 'queued') {
        actionBtn = `<button class="text-xs text-[#C5A059] hover:text-white border border-[#C5A059]/40 hover:border-[#C5A059] px-2 py-1 rounded transition-colors flex items-center gap-1">
          <i data-lucide="edit-3" class="w-3 h-3"></i> 라벨링 시작
        </button>`;
      } else if (row.labelState.key === 'in_progress') {
        actionBtn = `<button class="text-xs text-blue-400 hover:text-white border border-blue-500/40 hover:border-blue-500 px-2 py-1 rounded transition-colors flex items-center gap-1">
          <i data-lucide="edit-3" class="w-3 h-3"></i> 이어서 라벨링
        </button>`;
      } else if (row.labelState.key === 'completed') {
        actionBtn = `<button class="text-xs text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 px-2 py-1 rounded transition-colors flex items-center gap-1">
          <i data-lucide="eye" class="w-3 h-3"></i> 결과 확인
        </button>`;
      } else { // used
        actionBtn = `<span class="text-xs text-gray-500 italic">파인튜닝 적용됨</span>`;
      }

      const rowOpacity = isUsed ? 'opacity-50' : '';

      const tr = document.createElement('tr');
      tr.className = `hover:bg-white/5 transition-colors group border-b border-gray-800/50 ${rowOpacity}`;
      tr.innerHTML = `
        <td class="py-3 pl-3 pr-1 md:py-4 md:pl-4 md:pr-2">${checkbox}</td>
        <td class="hidden md:table-cell py-3 px-3 md:py-4 md:px-4 text-sm font-mono text-gray-400 group-hover:text-white whitespace-nowrap">${row.time}</td>
        <td class="py-3 px-3 md:py-4 md:px-4 whitespace-nowrap">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-gray-500"></div>
            <span class="text-sm font-medium text-gray-200">${row.model}</span>
          </div>
        </td>
        <td class="hidden lg:table-cell py-3 px-3 md:py-4 md:px-4 text-sm font-mono text-gray-300 whitespace-nowrap">${row.filename}</td>
        <td class="py-3 px-3 md:py-4 md:px-4 whitespace-nowrap">
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium border ${row.reason.cls}">
            <i data-lucide="${row.reason.icon}" class="w-3 h-3"></i>
            ${row.reason.label}
          </span>
        </td>
        <td class="hidden md:table-cell py-3 px-3 md:py-4 md:px-4 whitespace-nowrap">
          <div class="flex flex-col gap-1 w-24">
            <div class="flex justify-between text-xs text-gray-400">
              <span>${pct}%</span>
              <span class="${labelCls}">${label}</span>
            </div>
            <div class="w-full h-1 bg-gray-700 rounded-full overflow-hidden">
              <div class="h-full ${barColor}" style="width: ${pctInt}%"></div>
            </div>
          </div>
        </td>
        <td class="py-3 px-3 md:py-4 md:px-4 whitespace-nowrap">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border ${row.labelState.cls}">${row.labelState.label}</span>
        </td>
        <td class="py-3 px-3 md:py-4 md:px-4 whitespace-nowrap">${actionBtn}</td>
      `;
      tableBody.appendChild(tr);
    });

    lucide.createIcons(); // Re-run for dynamic content

    // 체크박스 + 파인튜닝 시작 버튼 연동
    const checkAll = document.getElementById('check-all');
    const startBtn = document.getElementById('btn-start-finetune');
    const selectedCountEl = document.getElementById('selected-count');

    function updateSelectedCount() {
      const selected = document.querySelectorAll('.row-check:checked').length;
      selectedCountEl.innerText = selected;
      startBtn.disabled = selected === 0;
    }

    checkAll.addEventListener('change', () => {
      document.querySelectorAll('.row-check').forEach(cb => { cb.checked = checkAll.checked; });
      updateSelectedCount();
    });

    document.querySelectorAll('.row-check').forEach(cb => {
      cb.addEventListener('change', updateSelectedCount);
    });

    startBtn.addEventListener('click', () => {
      const selected = document.querySelectorAll('.row-check:checked').length;
      if (selected === 0) return;
      alert(`선택된 ${selected}건의 보정 데이터로 파인튜닝 잡을 시작합니다.`);
    });

    // Sidebar Toggle Logic
    const sidebar = document.getElementById('sidebar');
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sidebar.classList.toggle('-translate-x-full');
      });
    }

    document.addEventListener('click', (e) => {
      if (window.innerWidth < 1024) {
        if (sidebar && !sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
          sidebar.classList.add('-translate-x-full');
        }
      }
    });
  </script>
</body>

</html>
